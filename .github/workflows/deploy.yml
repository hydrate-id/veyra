name: Deploy to GHCR

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g.: v1.0.1)"
        required: true
        type: string

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref_name }}

      - name: Set image tags
        id: tags
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          {
            echo "tags<<EOF"
            echo "ghcr.io/$REPO:$VERSION"
            echo "ghcr.io/$REPO:$MAJOR_MINOR"
            echo "ghcr.io/$REPO:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        if: github.event_name == 'release'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (release)
        if: github.event_name == 'release'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Docker image (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}

  binary-build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download Go modules
        run: go mod download

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/veyra-linux-amd64 main.go
          GOOS=linux GOARCH=arm64 go build -o dist/veyra-linux-arm64 main.go
          GOOS=darwin GOARCH=amd64 go build -o dist/veyra-darwin-amd64 main.go
          GOOS=darwin GOARCH=arm64 go build -o dist/veyra-darwin-arm64 main.go
          GOOS=windows GOARCH=amd64 go build -o dist/veyra-windows-amd64.exe main.go
          GOOS=windows GOARCH=arm64 go build -o dist/veyra-windows-arm64.exe main.go

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: |
            dist/veyra-linux-amd64
            dist/veyra-linux-arm64
            dist/veyra-darwin-amd64
            dist/veyra-darwin-arm64
            dist/veyra-windows-amd64.exe
            dist/veyra-windows-arm64.exe
